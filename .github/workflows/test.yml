name: Package checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Windows runs the real loader, the host render test and the installer rehearsal;
      # macOS checks the signature and rehearses its installer. Neither runs After Effects.
      - run: python -B -m unittest discover -s tests -v
